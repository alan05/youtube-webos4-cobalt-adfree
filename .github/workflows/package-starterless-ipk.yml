name: Package starterless Cobalt IPK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Application profile
        required: true
        type: choice
        options:
          - youtube
          - youtube-kids
      cobalt_run_id:
        description: Successful Build starterless Cobalt workflow run ID
        required: true
        type: string
      version:
        description: Package version (empty = version from appinfo.json)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package IPK from Cobalt run ${{ inputs.cobalt_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COBALT_RUN_ID: ${{ inputs.cobalt_run_id }}
      REQUESTED_VERSION: ${{ inputs.version }}
      COBALT_PACKAGE_PROFILE: ${{ inputs.profile }}
      SDK_TAG: webos-a38c582

    steps:
      - name: Validate Cobalt run ID
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COBALT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "cobalt_run_id must be a numeric GitHub Actions run ID." >&2
            exit 2
          }

      - name: Download Cobalt runtime artifact
        id: cobalt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/cobalt-artifact"
          mkdir -p "$artifact_dir"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COBALT_RUN_ID/artifacts")"
          mapfile -t artifact_names < <(
            jq -r '.artifacts[] | select(.expired == false) | select((.name | startswith("cobalt-")) or (.name | startswith("starterless-cobalt-"))) | select((.name | contains("build-log")) | not) | .name' <<<"$artifacts_json"
          )
          if [[ "${#artifact_names[@]}" -ne 1 ]]; then
            echo "Expected exactly one Cobalt runtime artifact in run $COBALT_RUN_ID." >&2
            jq -r '.artifacts[] | "  - \(.name) (expired=\(.expired))"' <<<"$artifacts_json" >&2
            exit 3
          fi
          artifact_name="${artifact_names[0]}"
          gh run download "$COBALT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$artifact_dir"
          archive="$(find "$artifact_dir" -maxdepth 1 -type f -name '*.tar.xz' -print -quit)"
          metadata="$artifact_dir/cobalt-build.txt"
          test -n "$archive"
          test -s "$archive"
          test -s "$archive.sha256"
          test -s "$metadata"
          expected_sha="$(awk 'NR == 1 { print $1 }' "$archive.sha256")"
          actual_sha="$(sha256sum "$archive" | awk '{ print $1 }')"
          test "$actual_sha" = "$expected_sha"
          source_ref="$(sed -n 's/^source_ref=//p' "$metadata")"
          source_sha="$(sed -n 's/^source_sha=//p' "$metadata")"
          cobalt_ref="$(sed -n 's/^cobalt_ref=//p' "$metadata")"
          build_type="$(sed -n 's/^build_type=//p' "$metadata")"
          test -n "$source_ref"
          test -n "$source_sha"
          test -n "$cobalt_ref"
          test -n "$build_type"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "cobalt_ref=$cobalt_ref" >> "$GITHUB_OUTPUT"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"

      - name: Check out requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          profile_file="packaging/profiles/$COBALT_PACKAGE_PROFILE.json"
          test -s "$profile_file"
          version="$REQUESTED_VERSION"
          source="workflow input"

          if [[ -z "$version" ]]; then
            version="$(jq -r '.version' "$profile_file")"
            source="$profile_file"
          fi

          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format, for example 2.0.2 or v2.0.2." >&2
            exit 4
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            jq --arg version "$version" '.version = $version' \
              "$profile_file" > "$profile_file.tmp"
            mv "$profile_file.tmp" "$profile_file"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Package version: $version ($source)"

      - name: Validate packaging source
        env:
          COBALT_SOURCE_SHA: ${{ steps.cobalt.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/package-starterless-cobalt.sh
          test -f scripts/normalize-ipk-ownership.py
          test -f scripts/verify-ipk-container.py
          profile_file="packaging/profiles/$COBALT_PACKAGE_PROFILE.json"
          test -s "$profile_file"
          test -s cobalt-platform/webos/system_fonts/fonts.xml
          case "$COBALT_PACKAGE_PROFILE" in
            youtube) icon_dir="assets" ;;
            youtube-kids) icon_dir="packaging/icons/youtube-kids" ;;
            *) echo "Invalid package profile" >&2; exit 2 ;;
          esac
          test -s "$icon_dir/icon.png"
          test -s "$icon_dir/largeIcon.png"
          test "$(jq -r '.version' "$profile_file")" = "${{ steps.version.outputs.version }}"
          source_sha="$COBALT_SOURCE_SHA"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid Cobalt source SHA" >&2
            exit 3
          }

          git cat-file -e "$source_sha^{commit}" || {
            echo "Cobalt source commit unavailable" >&2
            exit 3
          }

          git merge-base --is-ancestor "$source_sha" HEAD || {
            echo "Cobalt build is not an ancestor of this package" >&2
            exit 3
          }

          while IFS= read -r changed; do
            case "$changed" in
              packaging/*|webapp/*|scripts/package-starterless-cobalt.sh|scripts/verify-ipk-profile.py|.github/workflows/package-starterless-ipk.yml|README.md|docs/*|assets/icon.png|assets/largeIcon.png|repo.json|LICENSE*|NOTICE*|COPYING*)
                ;;
              *)
                echo "Cobalt source changed since build: $changed" >&2
                exit 3
                ;;
            esac
          done < <(git diff --name-only --no-renames "$source_sha" HEAD)

          echo "Cobalt source compatibility verified."
          echo "Packaging SHA: $(git rev-parse HEAD)"
          echo "Package version: ${{ steps.version.outputs.version }}"
          echo "Runtime source ref: ${{ steps.cobalt.outputs.source_ref }}"
          echo "Runtime source SHA: ${{ steps.cobalt.outputs.source_sha }}"
          echo "Cobalt ref: ${{ steps.cobalt.outputs.cobalt_ref }}"
          echo "Build type: ${{ steps.cobalt.outputs.build_type }}"

      - name: Build current webapp
        shell: bash
        run: |
          set -euo pipefail
          cd webapp
          npm ci --no-audit --no-fund
          npm run build -- --env production
          test -s output/adblockMain.js
          test -s output/adblockMain.css
          test -s output/adblockPreload.js

      - name: Extract Cobalt runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/workdir/artifact-runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          tar -xJf "${{ steps.cobalt.outputs.archive }}" -C "$runtime_dir"
          test -x "$runtime_dir/cobalt"
          test -d "$runtime_dir/content"
          grep -aFq '/web/adblock/adblockPreload.js' "$runtime_dir/cobalt"
          echo "runtime_dir=$runtime_dir" >> "$GITHUB_OUTPUT"

      - name: Install webOS packaging tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          ./node_modules/.bin/ares-package --version

      - name: Download ARM runtime libraries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sdk_download="$RUNNER_TEMP/webos-sdk-download"
          sdk_extract="$RUNNER_TEMP/webos-sdk"
          runtime_libs="$GITHUB_WORKSPACE/starterless-cobalt/lib"
          mkdir -p "$sdk_download" "$sdk_extract" "$runtime_libs"
          rm -f "$runtime_libs/libstdc++.so.6" "$runtime_libs/libgcc_s.so.1" "$runtime_libs/libatomic.so.1"
          gh release download "$SDK_TAG" --repo openlgtv/buildroot-nc4 --pattern 'arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz' --dir "$sdk_download" --clobber
          tar -xzf "$sdk_download/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz" -C "$sdk_extract"
          sysroot="$sdk_extract/arm-webos-linux-gnueabi_sdk-buildroot/arm-webos-linux-gnueabi/sysroot"
          libstdcpp_link="$(find "$sysroot" -name 'libstdc++.so.6' -print -quit)"
          libgcc_link="$(find "$sysroot" -name 'libgcc_s.so.1' -print -quit)"
          libatomic_link="$(find "$sysroot" -name 'libatomic.so.1' -print -quit)"
          test -e "$libstdcpp_link"
          test -e "$libgcc_link"
          test -e "$libatomic_link"
          cp -L "$libstdcpp_link" "$runtime_libs/libstdc++.so.6"
          cp -L "$libgcc_link" "$runtime_libs/libgcc_s.so.1"
          cp -L "$libatomic_link" "$runtime_libs/libatomic.so.1"

      - name: Package IPK
        id: package
        env:
          COBALT_BUILD_DIR: ${{ steps.runtime.outputs.runtime_dir }}
          COBALT_RUNTIME_DIR: ${{ github.workspace }}/starterless-cobalt/lib
          WEBAPP_OUTPUT_DIR: ${{ github.workspace }}/webapp/output
          COBALT_PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          bash scripts/package-starterless-cobalt.sh
          package_path="$(find output -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "$package_path"
          test -s "$package_path"
          sha256sum "$package_path" > "$package_path.sha256"
          echo "package_path=$package_path" >> "$GITHUB_OUTPUT"
          echo "package_name=$(basename "$package_path")" >> "$GITHUB_OUTPUT"

      - name: Verify packaged application
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-ipk-profile.py \
            --profile "$COBALT_PACKAGE_PROFILE" \
            --ipk "${{ steps.package.outputs.package_path }}" \
            --version "${{ steps.version.outputs.version }}" \
            --cobalt "${{ steps.runtime.outputs.runtime_dir }}/cobalt" \
            --webapp-dir webapp/output
      - name: Write package metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > output/ipk-build.txt <<EOF
          repository=$GITHUB_REPOSITORY
          cobalt_run_id=$COBALT_RUN_ID
          cobalt_artifact=${{ steps.cobalt.outputs.artifact_name }}
          cobalt_source_ref=${{ steps.cobalt.outputs.source_ref }}
          cobalt_source_sha=${{ steps.cobalt.outputs.source_sha }}
          cobalt_ref=${{ steps.cobalt.outputs.cobalt_ref }}
          cobalt_build_type=${{ steps.cobalt.outputs.build_type }}
          package_ref=$GITHUB_REF_NAME
          package_sha=$(git rev-parse HEAD)
          package_version=${{ steps.version.outputs.version }}
          package_profile=$COBALT_PACKAGE_PROFILE
          package_version_source=${{ steps.version.outputs.source }}
          package=${{ steps.package.outputs.package_name }}
          EOF

          {
            echo '## Cobalt IPK'
            echo
            echo "- Version: \`${{ steps.version.outputs.version }}\` (${{ steps.version.outputs.source }})"
            echo "- Cobalt workflow run: \`$COBALT_RUN_ID\`"
            echo "- Cobalt: \`${{ steps.cobalt.outputs.cobalt_ref }}\` / \`${{ steps.cobalt.outputs.build_type }}\`"
            echo "- IPK: \`${{ steps.package.outputs.package_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ inputs.profile }}-${{ steps.version.outputs.version }}-from-run-${{ inputs.cobalt_run_id }}
          path: |
            ${{ steps.package.outputs.package_path }}
            ${{ steps.package.outputs.package_path }}.sha256
            output/ipk-build.txt
          if-no-files-found: error
          retention-days: 14
